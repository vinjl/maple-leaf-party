<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="The Maple Leaf Party of Canada">
  <!--
    Design source for og-image.png (1200×630).
    Matches landing: paper #f6f1eb, maple browns, Syne/Outfit/Newsreader hierarchy,
    large faded maple leaf cut off on the right edge.
    Raster: website/og-image.png (served to Open Graph / Twitter).
  -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffcf8"/>
      <stop offset="55%" stop-color="#f6f1eb"/>
      <stop offset="100%" stop-color="#efe6dc"/>
    </linearGradient>
    <radialGradient id="leafWash" cx="92%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#b8643d" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#b8643d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leafFade" x1="42%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a482a" stop-opacity="0"/>
      <stop offset="28%" stop-color="#8a482a" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="#8a482a" stop-opacity="0.32"/>
      <stop offset="78%" stop-color="#8a482a" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#8a482a" stop-opacity="0.50"/>
    </linearGradient>
    <linearGradient id="veil" x1="0%" y1="0%" x2="55%" y2="0%">
      <stop offset="0%" stop-color="#f6f1eb" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#f6f1eb" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f6f1eb" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#leafWash)"/>
  <rect x="0" y="0" width="10" height="630" fill="#4a2118"/>

  <!-- Decorative large leaf (cut off right) — PNG uses logo.svg raster -->
  <g opacity="0.48" transform="translate(620,-80) scale(1.15)">
    <path fill="url(#leafFade)" d="M420 80c-20 40-48 78-78 98-18 12-28 10-42-2-22-18-48-52-78-98-8-12-6-18 6-16 38 6 78 28 110 56 4 4 8 2 10-4 8-28 6-72-2-118-2-12 4-16 12-8 28 28 58 72 78 118 4 8 2 14-8 12-24-4-52-18-76-38-4-4-10-2-12 6-6 22-4 58 4 92 2 10-2 14-10 8-26-20-54-54-72-90-6-12 0-18 10-12 30 16 64 48 88 84 6 8 2 14-8 12z"/>
  </g>
  <rect width="700" height="630" fill="url(#veil)"/>

  <!-- Type (system fallbacks; PNG embeds Syne / Outfit / Newsreader) -->
  <text x="72" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" font-weight="300" fill="#8a482a">Logic, with love for Canada</text>
  <text x="72" y="248" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="68" letter-spacing="-2.4" fill="#4a2118">The Maple Leaf</text>
  <text x="72" y="296" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="22" letter-spacing="6" fill="#6b3224">PARTY OF CANADA</text>
  <text x="72" y="330" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" letter-spacing="3.5" fill="#8a7020">A FEDERAL POLITICAL PARTY</text>
  <line x1="72" y1="360" x2="292" y2="360" stroke="rgba(107,50,36,0.2)" stroke-width="1"/>
  <text x="72" y="398" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="300" fill="rgba(26,18,20,0.7)">Open-source government · Citizens first</text>
  <text x="72" y="436" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="18" fill="#8a482a">www.mapleleafparty.ca</text>
</svg>
