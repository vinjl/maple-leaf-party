<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="The Maple Leaf Party of Canada">
  <!--
    Design source for og-image.png (1200×630).
    Title matches site .title .t1: Syne 800, letter-spacing ~-0.04em (tight, not wide).
    Rasterize with Chrome + Google Fonts (see prior gen) — do not use expanded system UI.
  -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffcf8"/>
      <stop offset="55%" stop-color="#f6f1eb"/>
      <stop offset="100%" stop-color="#efe6dc"/>
    </linearGradient>
    <linearGradient id="veil" x1="0%" y1="0%" x2="55%" y2="0%">
      <stop offset="0%" stop-color="#f6f1eb" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#f6f1eb" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f6f1eb" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="10" height="630" fill="#4a2118"/>
  <rect width="700" height="630" fill="url(#veil)"/>
  <!-- Syne metrics: negative tracking so “The Maple Leaf” is tight like the hero -->
  <text x="72" y="168" font-family="Newsreader, Georgia, serif" font-size="26" font-style="italic" font-weight="300" fill="#8a482a">Logical love for Canada</text>
  <text x="72" y="258" font-family="Syne, Outfit, system-ui, sans-serif" font-weight="800" font-size="72" letter-spacing="-3.2" fill="#4a2118">The Maple Leaf</text>
  <text x="72" y="306" font-family="Outfit, system-ui, sans-serif" font-weight="600" font-size="20" letter-spacing="4.8" fill="#6b3224">PARTY OF CANADA</text>
  <text x="72" y="340" font-family="Outfit, system-ui, sans-serif" font-weight="600" font-size="14" letter-spacing="2.5" fill="#8a7020">LIVING DRAFT</text>
  <line x1="72" y1="370" x2="272" y2="370" stroke="rgba(107,50,36,0.22)" stroke-width="1"/>
  <text x="72" y="412" font-family="Newsreader, Georgia, serif" font-size="20" font-weight="300" fill="rgba(26,18,20,0.72)">Open government · How we decide</text>
  <text x="72" y="452" font-family="Outfit, system-ui, sans-serif" font-weight="500" font-size="17" fill="#8a482a">www.mapleleafparty.ca</text>
</svg>
